<text x="345" y="735" font-family="Microsoft YaHei, Arial" font-size="13" fill="#b91c1c">0..1 : 0..N  author</text>
<rect x="1390" y="100" width="370" height="1050" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="1575.0" y="135" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#334155">配置与辅助模型</text>
<g><rect x="1408" y="165" width="334" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M1416,165 H1734 Q1742,165 1742,173 V211 H1408 V173 Q1408,165 1416,165" fill="#334155"/>
<text x="1575.0" y="196" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">OAuthConfig</text>
<text x="1422" y="235" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• type / appkey / appsecret</text>
<text x="1422" y="256" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• callback_url / is_enable</text>
<text x="1422" y="277" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• 同一平台仅一条配置</text>
</g>
<g><rect x="1408" y="315" width="334" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M1416,315 H1734 Q1742,315 1742,323 V361 H1408 V323 Q1408,315 1416,315" fill="#334155"/>
<text x="1575.0" y="346" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">Links</text>
<text x="1422" y="385" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• name / link / sequence</text>
<text x="1422" y="406" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• is_enable / show_type</text>
<text x="1422" y="427" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• 友情链接</text>
</g>
<g><rect x="1408" y="465" width="334" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M1416,465 H1734 Q1742,465 1742,473 V511 H1408 V473 Q1408,465 1416,465" fill="#334155"/>
<text x="1575.0" y="496" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">SideBar</text>
<text x="1422" y="535" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• name / content</text>
<text x="1422" y="556" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• sequence / is_enable</text>
<text x="1422" y="577" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• 自定义侧边栏</text>
</g>
<g><rect x="1408" y="615" width="334" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M1416,615 H1734 Q1742,615 1742,623 V661 H1408 V623 Q1408,615 1416,615" fill="#334155"/>
<text x="1575.0" y="646" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">BlogSettings</text>
<text x="1422" y="685" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• site_name / SEO / 主题</text>
<text x="1422" y="706" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• 备案 / 评论审核 / 页眉页脚</text>
<text x="1422" y="727" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• clean() 保证单例</text>
</g>
<g><rect x="1408" y="765" width="334" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M1416,765 H1734 Q1742,765 1742,773 V811 H1408 V773 Q1408,765 1416,765" fill="#334155"/>
<text x="1575.0" y="796" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">commands</text>
<text x="1422" y="835" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• title / command / describe</text>
<text x="1422" y="856" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• 运维命令说明</text>
</g>
<g><rect x="1408" y="915" width="334" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M1416,915 H1734 Q1742,915 1742,923 V961 H1408 V923 Q1408,915 1416,915" fill="#334155"/>
<text x="1575.0" y="946" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">EmailSendLog</text>
<text x="1422" y="985" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• emailto / title / content</text>
<text x="1422" y="1006" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• send_result / creation_time</text>
<text x="1422" y="1027" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• 邮件发送日志</text>
</g>
<text x="40" y="1240" font-family="Microsoft YaHei, Arial" font-size="14" fill="#475569">说明：实线箭头表示外键关联，双向连线表示多对多，空心三角表示继承；辅助配置表无核心内容关系。</text>
</svg>