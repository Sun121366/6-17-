<text x="450" y="650" font-family="Microsoft YaHei, Arial" font-size="13" fill="#b91c1c">1 : N  author</text>
<line x1="610" y1="660" x2="650" y2="820" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="625" y="745" font-family="Microsoft YaHei, Arial" font-size="13" fill="#b91c1c">1 : N  article</text>
<path d="M880 900 L930 900 L930 970 L880 970" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="938" y="940" font-family="Microsoft YaHei, Arial" font-size="13" fill="#b91c1c">parent_comment</text>
<line x1="880" y1="860" x2="940" y2="860" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="885" y="845" font-family="Microsoft YaHei, Arial" font-size="13" fill="#b91c1c">1 : N  reactions</text>
<path d="M340 330 L390 330 L390 1000 L870 1000" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="430" y="1018" font-family="Microsoft YaHei, Arial" font-size="13" fill="#b91c1c">1 : N  reaction user</text>
