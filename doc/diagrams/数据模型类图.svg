  <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
</marker>
<marker id="triangle" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L14,7 L0,14 z" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
