<rect width="100%" height="100%" fill="#ffffff"/>
<text x="900" y="52" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="34" font-weight="700" fill="#0f172a">DjangoBlog 数据模型类图</text>
<text x="900" y="82" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="16" fill="#475569">第五周作业：数据库与 Model 分析</text>
<g><rect x="40" y="160" width="300" height="220" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M48,160 H332 Q340,160 340,168 V206 H40 V168 Q40,160 48,160" fill="#334155"/>
<text x="190.0" y="178" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">自定义用户</text>
<text x="190.0" y="199" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">BlogUser</text>
<text x="54" y="230" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• nickname</text>
<text x="54" y="251" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• creation_time / last_modify_time</text>
<text x="54" y="272" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• source</text>
<text x="54" y="293" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• get_absolute_url()</text>
<text x="54" y="314" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• AUTH_USER_MODEL 指向本类</text>
</g>
<g><rect x="40" y="470" width="300" height="150" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M48,470 H332 Q340,470 340,478 V516 H40 V478 Q40,470 48,470" fill="#334155"/>
<text x="190.0" y="488" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">Django 内置</text>
<text x="190.0" y="509" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">AbstractUser</text>
<text x="54" y="540" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• username / password / email</text>
<text x="54" y="561" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• is_staff / is_superuser</text>
<text x="54" y="582" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• 认证与权限基础字段</text>
</g>
<g><rect x="40" y="760" width="300" height="170" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M48,760 H332 Q340,760 340,768 V806 H40 V768 Q40,760 48,760" fill="#334155"/>
<text x="190.0" y="778" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">第三方用户</text>
<text x="190.0" y="799" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">OAuthUser</text>
<text x="54" y="830" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• author（可空 FK）</text>
<text x="54" y="851" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• openid / nickname / token</text>
<text x="54" y="872" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• type / email / metadata</text>
</g>
<g><rect x="420" y="90" width="300" height="180" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M428,90 H712 Q720,90 720,98 V136 H420 V98 Q420,90 428,90" fill="#334155"/>
<text x="570.0" y="108" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">abstract</text>
<text x="570.0" y="129" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">BaseModel</text>
<text x="434" y="160" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• id</text>
<text x="434" y="181" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• creation_time</text>
<text x="434" y="202" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• last_modify_time</text>
<text x="434" y="223" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• save()</text>
<text x="434" y="244" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• get_absolute_url()*</text>
</g>
<g><rect x="420" y="360" width="360" height="300" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M428,360 H772 Q780,360 780,368 V406 H420 V368 Q420,360 428,360" fill="#334155"/>
<text x="600.0" y="378" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">文章/页面</text>
<text x="600.0" y="399" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">Article</text>
<text x="434" y="430" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• title / body / pub_time</text>
<text x="434" y="451" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• status / comment_status / type</text>
<text x="434" y="472" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• views / article_order / show_toc</text>
<text x="434" y="493" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• author: FK → BlogUser</text>
<text x="434" y="514" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• category: FK → Category</text>
<text x="434" y="535" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• tags: M:N → Tag</text>
<text x="434" y="556" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• viewed() / comment_list()</text>
</g>
<g><rect x="850" y="360" width="250" height="220" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M858,360 H1092 Q1100,360 1100,368 V406 H850 V368 Q850,360 858,360" fill="#334155"/>
<text x="975.0" y="378" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">分类</text>
<text x="975.0" y="399" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">Category</text>
<text x="864" y="430" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• name（唯一）</text>
<text x="864" y="451" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• parent_category: self FK</text>
<text x="864" y="472" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• slug / index</text>
<text x="864" y="493" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• get_category_tree()</text>
<text x="864" y="514" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• get_sub_categorys()</text>
</g>
<g><rect x="1170" y="360" width="230" height="180" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M1178,360 H1392 Q1400,360 1400,368 V406 H1170 V368 Q1170,360 1178,360" fill="#334155"/>
<text x="1285.0" y="378" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">标签</text>
<text x="1285.0" y="399" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">Tag</text>
<text x="1184" y="430" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• name（唯一）</text>
<text x="1184" y="451" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• slug</text>
<text x="1184" y="472" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• get_article_count()</text>
</g>
<g><rect x="520" y="820" width="360" height="230" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M528,820 H872 Q880,820 880,828 V866 H520 V828 Q520,820 528,820" fill="#334155"/>
<text x="700.0" y="838" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">评论/回复</text>
<text x="700.0" y="859" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">Comment</text>
<text x="534" y="890" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• body / creation_time</text>
<text x="534" y="911" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• author: FK → BlogUser</text>
<text x="534" y="932" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• article: FK → Article</text>
<text x="534" y="953" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• parent_comment: self FK</text>
<text x="534" y="974" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• is_enable</text>
<text x="534" y="995" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• get_reactions_summary()</text>
</g>
<g><rect x="940" y="820" width="340" height="180" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<path d="M948,820 H1272 Q1280,820 1280,828 V866 H940 V828 Q940,820 948,820" fill="#334155"/>
<text x="1110.0" y="838" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="12" fill="#e2e8f0">Emoji 反应</text>
<text x="1110.0" y="859" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#ffffff">CommentReaction</text>
<text x="954" y="890" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• comment: FK → Comment</text>
<text x="954" y="911" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• user: FK → BlogUser</text>
<text x="954" y="932" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• reaction_type</text>
<text x="954" y="953" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• created_at</text>
<text x="954" y="974" font-family="Microsoft YaHei, Arial" font-size="13" fill="#1e293b">• 唯一约束：评论+用户+类型</text>
</g>
